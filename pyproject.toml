[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-emailer"
version = "0.2.1"
description = "A secure local CLI and web interface for sending email through SMTP providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
simple-emailer = "emailer.__main__:main"

[tool.setuptools.package-data]
emailer = ["static/*"]
